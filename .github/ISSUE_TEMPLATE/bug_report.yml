name: Bug report
description: Something is not working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not include passwords, tokens or personal data.**
        If this is a security vulnerability, close this form and follow the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See error ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, commit or date of the version you were using, if known.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Logs, screenshots, environment details or links that help explain the problem.
    validations:
      required: false
